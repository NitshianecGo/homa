<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Private Space</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card glass-panel">
            <h2>Private Space</h2>
            <p class="subtitle">Закрытая социальная сеть</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required autocomplete="username">
                <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary glass-btn">Войти</button>
            </form>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН ПРИЛОЖЕНИЯ -->
    <div id="app-screen" class="screen">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: ЧАТЫ-КОНТАКТЫ -->
        <aside id="panel-contacts" class="panel glass-panel active">
            <header class="panel-header">
                <h3>💬 Чаты-контакты</h3>
            </header>
            <div id="contacts-list" class="scroll-content"></div>
        </aside>

        <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: ЧАТ -->
        <main id="panel-chat" class="panel glass-panel">
            <header class="panel-header chat-header">
                <div>
                    <h3 id="chat-title">Общий чат</h3>
                    <span id="typing-indicator" class="typing-text"></span>
                </div>
                <button id="clear-chat-btn" class="btn btn-danger btn-sm glass-btn-danger" title="Очистить диалог">🗑️ Очистить</button>
            </header>

            <div id="chat-messages" class="scroll-content messages-container"></div>

            <!-- Предпросмотр цитаты -->
            <div id="reply-preview" class="reply-preview-bar glass-panel" style="display: none;">
                <div class="reply-info">
                    <span class="reply-user" id="reply-user-name">Имя</span>
                    <span class="reply-text" id="reply-text-preview">Текст сообщения</span>
                </div>
                <button id="cancel-reply-btn" class="icon-btn">✖</button>
            </div>

            <!-- Панель ввода сообщения -->
            <div class="chat-input-area glass-panel">
                <button id="chat-file-btn" class="icon-btn">📎</button>
                <input type="file" id="chat-file-input" accept="image/*,video/*" hidden>

                <input type="text" id="chat-text-input" placeholder="Сообщение..." autocomplete="off">

                <button id="record-audio-btn" class="icon-btn">🎙️</button>
                <button id="send-msg-btn" class="btn btn-primary btn-icon glass-btn">➤</button>
            </div>
        </main>

        <!-- ПРАВАЯ ПАНЕЛЬ: СТЕНА (ЛЕНТА) -->
        <section id="panel-wall" class="panel glass-panel">
            <header class="panel-header">
                <h3>📰 Стена публикаций</h3>
            </header>
            <div class="wall-create-box glass-panel">
                <textarea id="post-text-input" placeholder="Что нового?"></textarea>
                <div class="wall-actions">
                    <button id="post-file-btn" class="btn btn-outline btn-sm glass-btn">📷 Медиа</button>
                    <input type="file" id="post-file-input" accept="image/*,video/*" hidden>
                    <span id="post-file-name" class="file-name-indicator"></span>
                    <button id="submit-post-btn" class="btn btn-primary btn-sm glass-btn">Опубликовать</button>
                </div>
            </div>
            <div id="wall-posts" class="scroll-content"></div>
        </section>

        <!-- ПАНЕЛЬ: НАСТРОЙКИ И ПРОФИЛЬ -->
        <section id="panel-settings" class="panel glass-panel">
            <header class="panel-header">
                <h3>⚙️ Профиль и Настройки</h3>
            </header>
            <div class="scroll-content settings-content">
                <div class="profile-card glass-panel">
                    <div class="avatar-wrapper">
                        <img id="user-avatar" src="https://via.placeholder.com/100" class="avatar-lg">
                        <button id="avatar-edit-btn" class="btn-avatar-edit">✏️</button>
                        <input type="file" id="avatar-file-input" accept="image/*" hidden>
                    </div>
                    <h3 id="user-display-name">Пользователь</h3>
                    <p id="user-email-text" class="text-muted"></p>
                </div>

                <div class="settings-group glass-panel">
                    <h4>Оформление</h4>
                    <div class="setting-item">
                        <span>Тёмная тема</span>
                        <button id="theme-toggle" class="btn btn-outline btn-sm glass-btn">Сменить тему</button>
                    </div>
                    <div class="setting-item">
                        <span>Размер шрифта</span>
                        <div class="font-controls">
                            <button id="font-dec" class="btn btn-outline btn-sm glass-btn">-</button>
                            <span id="font-size-val">100%</span>
                            <button id="font-inc" class="btn btn-outline btn-sm glass-btn">+</button>
                        </div>
                    </div>
                </div>

                <div class="settings-group glass-panel">
                    <button id="logout-btn" class="btn btn-danger btn-full glass-btn-danger">Выйти из аккаунта</button>
                </div>
            </div>
        </section>

        <!-- НИЖНЯЯ НАВИГАЦИЯ LIQUID GLASS (ДЛЯ МОБИЛЬНЫХ) -->
        <nav class="bottom-nav glass-nav">
            <button class="nav-btn active" data-target="panel-contacts">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Чаты-контакты</span>
            </button>
            <button class="nav-btn" data-target="panel-chat">
                <span class="nav-icon">✉️</span>
                <span class="nav-label">Диалог</span>
            </button>
            <button class="nav-btn" data-target="panel-wall">
                <span class="nav-icon">📰</span>
                <span class="nav-label">Стена</span>
            </button>
            <button class="nav-btn" data-target="panel-settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
