<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Homa App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Экран авторизации / чатов / контактов -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h2>Вход в Homa</h2>
                <input type="text" id="usernameInput" placeholder="Введите ваше имя...">
                <button id="loginBtn" class="primary-btn">Войти</button>
            </div>
        </div>

        <div id="main-screen" class="screen">
            <div class="header">
                <h1 id="pageTitle">Чаты</h1>
            </div>
            
            <div class="content-container">
                <!-- Вкладка Чаты -->
                <div id="chats-tab" class="tab-content active">
                    <div id="chatsList" class="list-container"></div>
                </div>

                <!-- Вкладка Контакты -->
                <div id="contacts-tab" class="tab-content">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Поиск контактов...">
                    </div>
                    <div id="contactsList" class="list-container"></div>
                </div>

                <!-- Вкладка Профиль -->
                <div id="profile-tab" class="tab-content">
                    <div class="profile-card">
                        <h3 id="profileName">Имя пользователя</h3>
                        <button id="logoutBtn" class="danger-btn">Выйти</button>
                    </div>
                </div>
            </div>

            <!-- 📱 ЕДИНАЯ СТЕКЛЯННАЯ КАПСУЛА НАВИГАЦИИ (iOS GLASS) -->
            <nav class="glass-nav">
                <button class="nav-btn active" data-tab="chats">
                    <span class="nav-icon">💬</span>
                    <span>Чаты</span>
                </button>
                <button class="nav-btn" data-tab="contacts">
                    <span class="nav-icon">👥</span>
                    <span>Контакты</span>
                </button>
                <button class="nav-btn" data-tab="profile">
                    <span class="nav-icon">⚙️</span>
                    <span>Профиль</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
