<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приватный Чат & Соцсеть</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>🔒 Вход в систему</h2>
            <p>Закрытый доступ только для 3 участников</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required autocomplete="username">
                <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="app-screen" class="screen">
        <header class="app-header">
            <div class="logo">💬 PrivateSpace</div>
            <div class="header-controls">
                <button id="theme-toggle" class="btn-icon" title="Переключить тему">🌙</button>
                <div class="font-scaler">
                    <button id="font-dec" class="btn-sm">A-</button>
                    <span id="font-size-val">100%</span>
                    <button id="font-inc" class="btn-sm">A+</button>
                </div>
            </div>
        </header>

        <main class="layout-container">
            <!-- ЛЕВАЯ КОЛОНКА: КОНТАКТЫ -->
            <section id="panel-contacts" class="panel active">
                <div class="panel-header">
                    <h3>👥 Участники</h3>
                </div>
                <div id="contacts-list" class="list-container">
                    <!-- Заполняется динамически из JS -->
                </div>
            </section>

            <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: ЧАТ -->
            <section id="panel-chat" class="panel">
                <div class="panel-header">
                    <h3 id="chat-title">💬 Общий чат</h3>
                    <span id="typing-indicator" class="typing-text"></span>
                </div>
                <div id="chat-messages" class="messages-container">
                    <!-- Сообщения генерируются скриптом -->
                </div>
                <div class="chat-input-area">
                    <label for="chat-file-input" class="btn-icon" title="Прикрепить файл">📎</label>
                    <input type="file" id="chat-file-input" accept="image/*,video/*" hidden>
                    
                    <input type="text" id="chat-text-input" placeholder="Введите сообщение..." autocomplete="off">
                    
                    <button id="record-audio-btn" class="btn-icon" title="Голосовое сообщение">🎙️</button>
                    <button id="send-msg-btn" class="btn btn-primary">➔</button>
                </div>
            </section>

            <!-- ПРАВАЯ КОЛОНКА: ПРОФИЛЬ, СТЕНА, НАСТРОЙКИ -->
            <section id="panel-profile" class="panel">
                <div class="panel-header">
                    <h3>👤 Профиль и Стена</h3>
                </div>
                <div class="profile-scroll-area">
                    <!-- Инфо профиля -->
                    <div class="profile-card">
                        <img id="user-avatar" src="https://via.placeholder.com/80" alt="Аватар" class="avatar-lg">
                        <h4 id="user-display-name">Загрузка...</h4>
                        <p id="user-email-text" class="text-muted"></p>
                    </div>

                    <!-- Форма создания поста -->
                    <div class="create-post-card">
                        <textarea id="post-text-input" placeholder="Что у вас нового на сегодня?" rows="3"></textarea>
                        <div class="post-actions">
                            <label for="post-file-input" class="btn-sm">📷 Фото</label>
                            <input type="file" id="post-file-input" accept="image/*" hidden>
                            <span id="post-file-name" class="file-name-tag"></span>
                            <button id="submit-post-btn" class="btn btn-primary btn-sm">Опубликовать</button>
                        </div>
                    </div>

                    <!-- Лента постов -->
                    <div class="wall-header">📜 Стена заметок</div>
                    <div id="wall-posts" class="posts-container">
                        <!-- Посты динамически -->
                    </div>

                    <!-- Настройки -->
                    <div class="settings-card">
                        <h4>⚙️ Настройки и Разрешения</h4>
                        <div class="setting-item">
                            <span>Уведомления</span>
                            <label class="switch">
                                <input type="checkbox" id="toggle-notifications">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <span>Звуки сообщений</span>
                            <label class="switch">
                                <input type="checkbox" id="toggle-sounds" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        
                        <div class="permissions-group">
                            <p class="text-muted">Проверка системных прав:</p>
                            <button id="req-mic-btn" class="btn btn-outline btn-sm">🎙️ Доступ к микрофону</button>
                            <button id="req-cam-btn" class="btn btn-outline btn-sm">📷 Доступ к камере</button>
                            <button id="req-notif-btn" class="btn btn-outline btn-sm">🔔 Разрешить Push</button>
                        </div>

                        <button id="logout-btn" class="btn btn-danger full-width">🚪 Выйти из аккаунта</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ ДЛЯ МОБИЛЬНЫХ -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="panel-contacts">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Контакты</span>
            </button>
            <button class="nav-btn" data-target="panel-chat">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Чат</span>
            </button>
            <button class="nav-btn" data-target="panel-profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Основной скрипт как ES-модуль для работы Firebase v10 SDK -->
    <script type="module" src="app.js"></script>
    <script>
        // Защита от отладки и просмотра кода
        setInterval(() => { debugger; }, 100);
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
